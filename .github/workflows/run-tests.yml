name: run-tests
on:
  pull_request:
    branches:
      - 'develop'
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.1.0"
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/checkout@v4
      - uses: maierj/fastlane-action@v2.2.0
        with:
          lane: 'tests'
          subdirectory: 'app/fastlane'
